<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ryo Apps</title>
<style>
  :root { --bg:#f7f4ee; --ink:#1c1b19; --sub:#6b665d; --line:#d9d2c4; --acc:#9a7b3c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141312; --ink:#ece7dc; --sub:#9b958a; --line:#2e2b27; --acc:#c9a862; }
  }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif; line-height:1.9; }
  main { max-width:680px; margin:0 auto; padding:56px 20px 80px; }
  h1 { font-size:1.6rem; font-weight:500; letter-spacing:.08em; margin:0; }
  .lead { color:var(--sub); font-size:.9rem; margin:4px 0 40px; }
  section { border-top:1px solid var(--line); padding:20px 0; }
  h2 { font-size:1.1rem; font-weight:500; margin:0 0 4px; }
  p { margin:0 0 8px; font-size:.95rem; }
  a { color:var(--acc); }
</style>
</head>
<body>
<main>
  <h1>Ryo Apps</h1>
  <p class="lead">個人で作っている Android アプリ</p>

  <section>
    <h2>家計簿</h2>
    <p>記録は端末の中だけに。口座・カード・固定費・予算までまとめて記す、静かで上品な家計簿。</p>
    <p><a href="kakeibo/privacy-policy/">プライバシーポリシー</a></p>
  </section>
</main>
</body>
</html>
